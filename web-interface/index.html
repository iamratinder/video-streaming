<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC File Streaming</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>WebRTC File Streaming</h1>

    <div class="container">
        <div class="role-selector">
            <h2>Select Role</h2>
            <select id="roleSelect">
                <option value="sender">Sender (Stream Media)</option>
                <option value="receiver">Receiver (Watch Only)</option>
            </select>
        </div>

        <div class="file-controls" id="fileControlsSection">
            <h2>1. Select Media Files</h2>
            <div class="file-info">
                <label for="videoFile">Select Video File:</label>
                <input type="file" id="videoFile" accept="video/*">
                <br>
                <label for="audioFile">Select Audio File:</label>
                <input type="file" id="audioFile" accept="audio/*">
            </div>
            
            <button id="previewBtn" disabled>Preview Combined Stream</button>
            <div class="status" id="fileStatus">Please select video and audio files...</div>
        </div>

        <div class="connection-controls">
            <h2>2. Connection Controls</h2>
            <div class="connection-status-indicator"></div>
            <div class="room-controls">
                <input type="text" id="roomId" placeholder="Enter Room ID" disabled>
                <button id="createRoomBtn" disabled>Create Room</button>
                <button id="joinRoomBtn" disabled>Join Room</button>
            </div>
            <div class="status" id="connectionStatus">Preview media files to enable room controls...</div>
        </div>
    </div>

    <div class="video-container">
        <div class="video-wrapper">
            <h2>Local Preview</h2>
            <video id="localVideo" autoplay muted playsinline></video>
            <div class="video-controls">
                <button id="localPlayBtn">Play</button>
                <button id="localPauseBtn">Pause</button>
                <button id="localMuteBtn">Mute Audio</button>
            </div>
            <div class="log" id="localLog">Local log...</div>
        </div>
        <div class="video-wrapper">
            <h2>Remote Stream</h2>
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="video-controls">
                <button id="remotePlayBtn">Play</button>
                <button id="remotePauseBtn">Pause</button>
                <button id="remoteMuteBtn">Mute Audio</button>
                <button id="remoteForcePlay">Force Play</button>
            </div>
            <div class="log" id="remoteLog">Remote log...</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
